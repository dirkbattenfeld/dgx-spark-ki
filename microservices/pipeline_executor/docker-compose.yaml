services:
  pipeline_executor:
#    build:
#      context: ../..
#      dockerfile: microservices/pipeline_executor/Dockerfile
    env_file:
      - ../../.env
    image: pipeline_executor:v1
    container_name: pipeline_executor
    command: tail -f /dev/null

    # Aktiviert das interaktive Terminal (entspricht -it bei docker run)
    tty: true
    stdin_open: true
    volumes:
      # der gesamte Workspace des Repos (später beseitigen)
      - ../..:/workspace
      # root directory
      - ./app:/app
      # code of basic applications, common libs and configs from dgx-spark-stack monorepo
      - ../../applications:/spark/applications
      - ../../libs:/spark/libs
      - ../../configs:/spark/configs
      # projects dir contains data, logs and configs
      - ../../projects:/spark/projects
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app:/spark/libs:/spark/configs:/spark/applications



