type: ki_dagster.components.ai_pipeline.AIPipelineComponent

attributes:
  nodes:
    - name: pipeline_gradient_boosting
      node_id: 001_gradboost_opt
      type: pipelineexecutor
      base_path: "/app/projects/ml"
      config_path: "configs/ml_gradientboosting.yaml"
      build_log_path: "logs/build"
      run_log_path: "logs/run" 
      generator_name: optuna
      generator_config:
        optuna_base:
          study_name: "gradient_boosting_20260208"
          sampler_type: "TPE"
          pruner_type: "Median"
          metric: "roc_auc_score"     
          direction: "maximize"
          n_trials: 2
          target_component: "ml_runner"
          parameter_prefix: "config"   # Für deepmerge bei ml_runner in die modelspecs
        search_space:
          n_estimators:
            method: "suggest_int"
            args: [200, 400]
          learning_rate:
            method: "suggest_float"
            args: [0.01, 0.1]
          max_depth:
            method: "suggest_int"
            args: [3, 10]

    - name: pipeline_randomforest
      node_id: 002_randforest_opt
      type: pipelineexecutor
      base_path: "/app/projects/ml"
      config_path: "configs/ml_randomforest.yaml"
      build_log_path: "logs/build"
      run_log_path: "logs/run" 
      generator_name: optuna
      generator_config:
        optuna_base:
          study_name: "randomforest_20260208"
          sampler_type: "TPE"
          pruner_type: "Median"
          metric: "roc_auc_score"  
          direction: "maximize"
          n_trials: 2
          target_component: "ml_runner"
          parameter_prefix: "config"   # Für deepmerge bei ml_runner in die modelspecs
        search_space:
          n_estimators:
            method: "suggest_int"
            args: [50, 200]
          max_depth:
            method: "suggest_int"
            args: [3, 10]
          min_samples_split:
            method: "suggest_int"
            args: [2, 10]

    - name: pipeline_analyze_studies
      node_id: 000_analyze_studies
      deps: 
        - 001_gradboost_opt
        - 002_randforest_opt
      type: pipelineexecutor
      base_path: "/app/projects/ml"
      config_path: "configs/analyze_study.yaml"
      build_log_path: "logs/build"
      run_log_path: "logs/run" 
      generator_name: none

    - name: pipeline_gradient_boosting
