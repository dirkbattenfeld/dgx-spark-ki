---
#
# USER Konfiguration
# GUI Default hier konfigurieren
#
#gui_dev_command: "python /spark/applications/rag_gui/start_gui.py"
gui_dev_command: "tail -f /dev/null"

#
# Zuordnung von Services zu Hosts und Ports
#
dispatcher_ip: "{{ pc_ip }}"
redis_host: "{{ pc_ip }}"
redis_port: 6379

s3_endpoint_ip: "{{ pc_ip }}"
s3_bucket_name: "my-rag-bucket"

# PostGreSQL für Ingestion
postgres_user: "ingestion_user"
postgress_password: "ingestion_pw"
postgres_db: "ingestion_db"
postgres_server: "{{ pc_ip }}"
postgres_port: 5432

# Huggingface
hf_home_pc: "/models/huggingface_cache"

# Docling Service Configuration
docling_workers: 6

# Ingestion Engine
ingestion_worker_concurrency: 4
ingestion_batch_size: 100

#
# Generische Konfiguration
#
compose_bake: "true"
container_uid: 1000
container_gid: 1000

microservice_config_path: "/spark/configs/microservices.yaml"

app_db_module: "rag_gui.core.sqlite_repository"
app_db_class: "SQLiteRepository"
app_db_path: "/spark/applications/rag_gui/dev_state.db"
app_reset_db: "false"

app_orchestrator_module: "rag_gui.core.orchestrator"
app_orchestrator_class: "Orchestrator"

chainlit_presenter_module: "rag_gui.chainlit.presenter"
chainlit_presenter_class: "ChainlitPresenter"

nicegui_presenter_module: "rag_gui.nicegui.presenter"
nicegui_presenter_class: "NiceGUICockpitPresenter"

app_bus_module: "rag_gui.core.redis_bus"
app_bus_class: "RedisEventBus"
