---
# Stufe 1: Lädt auf localhost alle group_vars/all/*.yml und registriert den active_pc_host
- name: 🔍 Ziel-Host aus group_vars ermitteln
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Dynamische Zielgruppe erstellen
      add_host:
        name: "{{ active_pc_host }}"
        groups: active_target

# Stufe 2: Das eigentliche Deployment auf der dynamisch ermittelten Maschine
- name: Deploy DGX Spark KI
  hosts: active_target

  vars:
    deployment_action: "{{ target_state | default('present') }}"

  tasks:
    - name: Generate central .env file from template
      template:
        src: "{{ playbook_dir }}/templates/pc_env.j2"
        dest: "{{ playbook_dir }}/../.env"
        mode: '0644'

    - name: Create configs directory if not exists
      file:
        path: "{{ playbook_dir }}/../configs"
        state: directory
        mode: '0755'

    - name: Generate microservices.yaml from template
      template:
        src: "{{ playbook_dir }}/templates/microservices.j2"
        dest: "{{ playbook_dir }}/../configs/microservices.yaml"
        mode: '0644'

    - name: Manage Dispatcher Service
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/../microservices/dispatcher"
        env_files:
          - "{{ playbook_dir }}/../.env"
        state: "{{ deployment_action }}"
      tags: [dispatcher]

    - name: Manage Garage S3 Service
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/../microservices/garage-s3"
        env_files:
          - "{{ playbook_dir }}/../.env"
        state: "{{ deployment_action }}"
      tags: [garage]

#    - name: 4. Manage Pipeline-Server Service
#      community.docker.docker_compose_v2:
#        project_src: "{{ playbook_dir }}/../microservices/pipeline-server"
#        env_files:
#          - "{{ playbook_dir }}/../.env"
#        state: "{{ deployment_action }}"
#      tags: [pipeline-server]

    - name: Manage Pipeline Orchestrator Service
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/../microservices/pipeline_orchestrator"
        env_files:
          - "{{ playbook_dir }}/../.env"
        state: "{{ deployment_action }}"
      tags: [pipeline-orchestrator]

    - name: Manage Qdrant Vector Database
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/../microservices/qdrant"
        env_files:
          - "{{ playbook_dir }}/../.env"
        state: "{{ deployment_action }}"
      tags: [qdrant]

    - name: Manage Redis Database
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/../microservices/redis"
        env_files:
          - "{{ playbook_dir }}/../.env"
        state: "{{ deployment_action }}"
      tags: [redis]

    - name: Manage Control Plane gui_dev for Chainlit / NiceGUI
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/../control-plane/gui_dev"
        env_files:
          - "{{ playbook_dir }}/../.env"
        state: "{{ deployment_action }}"
      tags: [gui_dev]
